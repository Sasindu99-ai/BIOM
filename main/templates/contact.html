{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="py-5 bg-light">
  <div class="container">
    <h2 class="fw-bold mb-1">Contact Us</h2>
    <p class="text-muted mb-4">Questions, datasets, or collaborations? Reach out — we'd love to hear from you.</p>
    <div class="row">
      <div class="col-lg-5 mb-4 mb-lg-0">
        <ul class="list-unstyled">
          <li class="mb-2"><a href="mailto:sasindusulochana99@gmail.com" class="text-dark"><i class="fas fa-envelope text-success me-2"></i> sasindusulochana99@gmail.com</a></li>
          <li class="mb-2"><a href="https://biom.pythonanywhere.com" class="text-dark" target="_blank" rel="noopener"><i class="fas fa-globe text-success me-2"></i> biom.pythonanywhere.com</a></li>
        </ul>
      </div>
      <div class="col-lg-7">
        <form method="post" action="#">
          {% csrf_token %}
          <div class="row">
            <div class="col-lg-6 mb-3">
              <label class="fw-bold mb-1">Name</label>
              <input class="form-control" type="text" name="name" placeholder="Enter your name" required />
            </div>
            <div class="col-lg-6 mb-3">
              <label class="fw-bold mb-1">Email address</label>
              <input class="form-control" type="email" name="email" placeholder="Enter your email" required />
              <small class="text-muted">We'll never share your email with anyone else.</small>
            </div>
            <div class="col-lg-6 mb-3">
              <label class="fw-bold mb-1">Subject</label>
              <input class="form-control" type="text" name="subject" placeholder="Enter your subject" required />
            </div>
            <div class="col-12 mb-3">
              <label class="fw-bold mb-1">Message</label>
              <textarea class="form-control" name="message" rows="5" placeholder="Enter your message" required></textarea>
            </div>
            <div class="col-12 mb-3">
              <button type="submit" class="btn btn-success">Send</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
